services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-planner-postgres
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - travel_planner_data:/var/lib/postgresql/data

volumes:
  travel_planner_data: